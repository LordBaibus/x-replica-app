name: x_replica
description: "X Replica - an educational replica of the X social app built with Flutter, adaptive_platform_ui and Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Native iOS (Cupertino / iOS 26 Liquid Glass) + Material on Android
  adaptive_platform_ui: ^1.0.2

  # Backend: auth, database, storage, realtime
  supabase_flutter: ^2.18.3

  image_picker: ^1.1.2

  # Video posts: player in the feed and the full-screen viewer
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  flutter_cache_manager: ^3.4.1

  # GIF search (GIPHY REST API)
  http: ^1.2.2

  # "Tag location": GPS position + place names (no API key needed)
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Grok voice: dictation (speech to text) and spoken answers
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Makes the app icon (the X logo) for Android and iOS from assets/icon.
  # Run once after changing the pictures:  dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

# App icon: white X logo on black. Android gets an adaptive icon (the X on a
# black background layer), iOS gets the flat 1024 px picture without alpha.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
