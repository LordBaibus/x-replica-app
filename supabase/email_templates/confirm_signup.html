<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#0f1419">
  <h2 style="margin:0 0 12px;font-size:22px;font-weight:800">Confirm your email</h2>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#536471">Welcome to X Replica! Enter this 6-digit code in the app to confirm your email address.</p>
  <p style="margin:0 0 20px;padding:16px 0;text-align:center;font-size:36px;font-weight:800;letter-spacing:10px;background:#f7f9f9;border-radius:12px">{{ .Token }}</p>
  <p style="margin:0;font-size:13px;line-height:1.5;color:#536471">The code expires soon. If you didn't create an account, you can ignore this email.</p>
</div>
